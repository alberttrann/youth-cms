name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strapi
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strapi -d strapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi
        env:
          NODE_ENV: production
          APP_KEYS: test-key-1,test-key-2,test-key-3,test-key-4
          API_TOKEN_SALT: test-api-token-salt
          ADMIN_JWT_SECRET: test-admin-jwt-secret
          TRANSFER_TOKEN_SALT: test-transfer-token-salt
          ENCRYPTION_KEY: test-encryption-key
        run: npm run build

      - name: Smoke test production server
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 1337
          APP_KEYS: test-key-1,test-key-2,test-key-3,test-key-4
          API_TOKEN_SALT: test-api-token-salt
          ADMIN_JWT_SECRET: test-admin-jwt-secret
          JWT_SECRET: test-jwt-secret
          TRANSFER_TOKEN_SALT: test-transfer-token-salt
          ENCRYPTION_KEY: test-encryption-key
          DATABASE_CLIENT: postgres
          DATABASE_URL: postgresql://strapi:strapi@127.0.0.1:5432/strapi
          DATABASE_SSL: false
        run: |
          set -e
          npm run start > /tmp/strapi.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            health_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:1337/_health || true)
            if [ "$health_status" = "204" ]; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              cat /tmp/strapi.log
              exit 1
            fi
            sleep 2
          done

          admin_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:1337/admin)
          test "$admin_status" = "200"

  build:
    name: Build and publish image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
